    definition:
      kind: prompt
      model: gpt-5-mini
      instructions: 'Assess the creditworthiness of the UK exporter (the SME) and
        the viability of the specific transaction.

        Core Task: Analyze the balance sheet and the "Additionality" of the request.

        Key Indicators:

        Liquidity & Solvency: Check the debt-to-equity ratio and current ratio (looking
        for signs of stress like the "60-day debtor cycle").

        Additionality: Prove the deal cannot proceed on similar terms with a private
        bank (i.e., identifying the "Market Failure").

        Export Potential: Verify that at least 20% of turnover is from exports (or
        5% over 3 years).


        Output Requirement: A financial "Health Score" (1–10) and a recommendation
        on whether the requested facility (e.g., GEF or EDG) is appropriate for the
        company’s size.'
      reasoning:
        effort: high
      tools:
      - type: code_interpreter
