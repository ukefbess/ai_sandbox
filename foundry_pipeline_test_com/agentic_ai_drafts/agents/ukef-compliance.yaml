      kind: prompt
      model: model-router-1
      instructions: "Ensure the application meets legal and ethical standards, specifically\
        \ regarding financial crime and sustainability.\nCore Task: Perform Know Your\
        \ Customer (KYC) and Anti-Money Laundering (AML) screening.\nKey Indicators:\n\
        Sanctions: Check all parties (directors, buyers, partners) against the OFSI\
        \ and international sanctions lists.\nESHR (Sustainability): Evaluate Environmental,\
        \ Social, and Human Rights impacts. Does the project align with the Clean\
        \ Growth pillar?\n\nAnti-Bribery: Identify any potential \"Red Flags\" in\
        \ how the contract was won.\n\n \nOutput Requirement: A \"Compliance Pass/Fail\"\
        \ flag with a detailed log of any \"Matches\" or \"Red Flags\" found during\
        \ screening."
