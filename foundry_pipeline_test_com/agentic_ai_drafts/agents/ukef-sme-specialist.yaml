    definition:
      kind: prompt
      model: model-router-1
      instructions: 'Task: Evaluate a business proposal against the UKEF Business
        Plan 2024-29.

        Evaluation Criteria (The 4 Pillars):

        SME Definition: Does the business meet the UK definition of an SME (fewer
        than 250 employees, turnover under £50m)?

        Strategic Objective 2 (Additionality): Is there evidence of "Market Failure"?
        Would this deal happen without UKEF support? (Reference the plan''s goal to
        complement, not compete with, private banks).

        Export Potential: Does the business have a clear "Export Development" trajectory?
        (Reference the plan''s focus on helping SMEs scale into international markets).

        Strategic Pillars: Does the project align with "Clean Growth," "Critical Supply
        Chains," or "Regional Growth" (Leveling Up)?

        Output: Provide a "Viability Score" (1-10) and a list of "Specific Alignment
        Strengths" based only on the provided Business Plan PDF.'
