kind: workflow
trigger:
  kind: OnConversationStart
  id: trigger_wf
  actions:
    - kind: InvokeAzureAgent
      id: RouterStep
      agent:
        name: ukef-router
      description: First agent in sequential workflow
      conversationId: =System.ConversationId
      input:
        messages: =System.LastMessage
      output:
        messages: Local.LatestMessage
        autoSend: true
    - kind: ConditionGroup
      conditions:
        - condition: '=Contains(Text(Local.LatestMessage), "INTENT: QUERY")'
          actions:
            - kind: GotoAction
              actionId: FinalReportStep
              id: node-1777819858401
          id: if-node-1777819392018-et26s84w
      id: node-1777819392018
      elseActions: []
    - kind: InvokeAzureAgent
      id: CountryRiskStep
      agent:
        name: ukef-country-risk
      conversationId: =System.ConversationId
      input:
        messages: =Local.LatestMessage
      output:
        autoSend: true
        messages: Local.LatestMessage
        responseObject: Local.Var8869
    - kind: InvokeAzureAgent
      id: SMEStep
      agent:
        name: ukef-sme-specialist
      conversationId: =System.ConversationId
      input:
        messages: =Local.LatestMessage
      output:
        autoSend: true
        messages: Local.LatestMessage
        responseObject: Local.Var8869
    - kind: InvokeAzureAgent
      id: FinancialStep
      agent:
        name: ukef-financial
      conversationId: =System.ConversationId
      description: Second agent in sequential workflow
      input:
        messages: =Local.LatestMessage
      output:
        messages: Local.LatestMessage
        autoSend: true
        responseObject: Local.Var8869
    - kind: InvokeAzureAgent
      id: RiskStep
      agent:
        name: ukef-risk-auditor
      conversationId: =System.ConversationId
      description: Third agent in sequential workflow
      input:
        messages: =Local.LatestMessage
      output:
        messages: Local.LatestMessage
        autoSend: true
        responseObject: Local.Var8869
    - kind: InvokeAzureAgent
      id: ComplianceStep
      agent:
        name: ukef-compliance
      conversationId: =System.ConversationId
      input:
        messages: =Local.LatestMessage
      output:
        autoSend: true
        messages: Local.LatestMessage
        responseObject: Local.Var8869
    - kind: InvokeAzureAgent
      id: FinalReportStep
      agent:
        name: ukef-summarizer
      conversationId: =System.ConversationId
      input:
        messages: =Local.LatestMessage
      output:
        autoSend: true
        messages: Local.LatestMessage
        responseObject: Local.Var8869
    - kind: EndConversation
      id: node-1777812770393
