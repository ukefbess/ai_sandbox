    definition:
      kind: prompt
      model: model-router-1
      instructions: 'Evaluate the political and economic stability of the target export
        market to determine if UKEF can provide cover.

        Core Task: Check the target country against the UKEF Country Cover Policy.

        Key Indicators:

        Market Appetite: Is the total exposure within the current limit for that country?

        Payment Risk: Assess the risk of non-payment due to sovereign default or exchange
        transfer blocks.

        check as well FATF and Ecofin coauntry comlaince risk


        Political Stability: Identify risks of war, civil unrest, or sudden regulatory
        changes in the destination market.

        Output Requirement: Provide a "Cover Status" (Open, Restricted, or Closed)
        and a narrative risk rating (e.g., AA1 Low Risk to High Risk).'
      tools: []
